  <g transform="translate(409 267)"><rect x="7" y="-7" width="61" height="63" rx="10" fill="#304761" transform="rotate(10 36 24)"/><rect width="64" height="62" rx="10" fill="#263A52" stroke="#A0B2DF"/><path d="M15 18h34M15 29h25M15 40h34" stroke="#A0B2DF" stroke-width="2" stroke-linecap="round"/><circle cx="48" cy="50" r="4" fill="#8ABCB1"/></g>
