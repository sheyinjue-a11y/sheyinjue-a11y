  <text x="30" y="117" font-family="Trebuchet MS,Arial,sans-serif" font-size="59" font-weight="700" letter-spacing="-2" fill="#EDF2FA">Curiosity,</text>
  <text x="30" y="186" font-family="Trebuchet MS,Arial,sans-serif" font-size="59" font-weight="700" letter-spacing="-2" fill="#EDF2FA">with context.</text>
  <text x="33" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#B6C7DE">Agents, memory,</text>
  <text x="33" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#B6C7DE">and things worth building.</text>
