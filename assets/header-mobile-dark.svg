<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Sheyinjue — Curiosity, with context.</title>
  <desc id="desc">Notebook lettering and a path connecting small notes into remembered context.</desc>
  <defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A0B2DF" opacity=".15"/></pattern></defs>
